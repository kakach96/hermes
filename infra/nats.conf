# 赫尔墨斯 v0 —— NATS 本机配置
# 版本锁死：nats-server v2.15.3（windows-amd64 单二进制）
# 启动：infra\nats-server.exe -c infra\nats.conf -sd infra\natsdata

# 监听端口（core / server 都按此连接）
port: 4222

# JetStream 持久化到磁盘文件存储（v0 的"历史消息"真相之源）
# 注意：相对路径按进程工作目录解析 —— 约定一律从仓库根启动
jetstream {
  store_dir: "./infra/natsdata"
  max_memory_store: 256MB
  max_file_store: 2GB
}

# 调试期保留这些日志，观察能学到 NATS 协议的握手过程
debug: false
trace: false
