[package]
name = "hermes-core"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
env_logger = "0.11"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.9"
# 认证平面（/v1/login|register）的 HTTP 客户端。
# 不启用 TLS：v0 端点都是本机 http://，省掉整棵 TLS 依赖树
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Signal Protocol 官方纯 Rust 实现（X3DH/PQXDH + 双棘轮）。AGPL-3.0。
# 经本地 vendor 引入：cargo 直接 git fetch 会拉全量历史（数 GB），慢到趴窝；
# 用 shallow clone 放在仓库外，按需重新 vendor：
#   git clone --depth 1 https://github.com/signalapp/libsignal <路径>
# crates.io 同名 crate（0.1.0）是社区旧 C 绑定封装，勿用。
# 官方 libsignal 以 shallow clone 方式 vendor 在仓库根 vendor/（不入库）：
#   git clone --depth 1 https://github.com/signalapp/libsignal vendor/libsignal
# crates.io 同名 crate（0.1.0）是老的 C 绑定封装，不能用。
libsignal-protocol = { path = "../vendor/libsignal/rust/protocol" }
libsignal-core = { path = "../vendor/libsignal/rust/core" }
