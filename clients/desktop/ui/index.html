<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hermes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ① 登录/注册 -->
  <div id="auth" class="overlay">
    <button id="theme" class="theme-toggle" title="切换浅色/深色">☾</button>
    <div class="card">
      <div class="wordmark">hermes<span class="dot"></span></div>
      <div class="card-sub">beamed messages, no noise</div>
      <input id="base" class="field" spellcheck="false" value="http://127.0.0.1:8080" />
      <input id="name" class="field" spellcheck="false" data-i18n-ph="auth.namePh" autofocus />
      <div class="auth-row">
        <button id="login-btn" class="btn half" data-i18n="auth.signIn">登录</button>
        <button id="register-btn" class="btn half" data-i18n="auth.signUp">注册</button>
      </div>
      <div id="auth-error" class="join-error"></div>
    </div>
  </div>

  <!-- ②③ 登录后外壳：大厅 + 聊天共用头部与用户菜单 -->
  <div id="main" class="hidden">
    <header>
      <div class="head-left">
        <span class="mark">hermes</span>
        <span id="presence-dot" class="pulse"></span>
        <span id="room-tag" class="tag" title="">lobby/general</span>
      </div>
      <span class="spacer"></span>
      <button id="user-btn" class="me-btn" data-i18n-title="account.title" title="账号菜单"></button>
      <!-- 用户名弹窗：语言 / 主题 / 离开房间（聊天页） / 退出登录 -->
      <div id="user-menu" class="user-menu hidden">
        <button id="lang-item" class="menu-item">🌐 <span data-i18n="menu.lang">语言</span></button>
        <button id="theme-item" class="menu-item"><span id="theme-icon">☾</span> <span data-i18n="menu.theme">切换主题</span></button>
        <button id="leave-item" class="menu-item menu-danger">⏻ <span data-i18n="menu.leaveRoom">退出房间</span></button>
        <button id="logout-item" class="menu-item menu-danger">⏏ <span data-i18n="menu.signOut">退出登录</span></button>
      </div>
    </header>

    <!-- ② 大厅：空间 / 频道 -->
    <div id="home" class="hidden">
      <div class="home-cols">
        <section class="home-col">
          <div class="home-head"><h2 data-i18n="home.spaces">空间</h2></div>
          <div class="home-new">
            <input id="new-space" class="home-in" spellcheck="false" data-i18n-ph="home.newSpacePh" />
            <button id="btn-new-space" class="mini" data-i18n="home.createSpace">建空间</button>
          </div>
          <ul id="space-list-ui" class="home-list"></ul>
        </section>
        <section class="home-col">
          <div class="home-head"><h2 id="ch-title" data-i18n="home.channelsPick">频道 · 选一个空间</h2></div>
          <div class="home-new">
            <input id="new-channel" class="home-in" spellcheck="false" data-i18n-ph="home.newChannelPh" />
            <button id="btn-new-channel" class="mini" data-i18n="home.createChannel">建频道</button>
          </div>
          <ul id="channel-list-ui" class="home-list"></ul>
        </section>
      </div>
      <div id="home-hint" class="home-hint"></div>
    </div>

    <!-- ③ 聊天 -->
    <div id="chat" class="hidden">
      <main id="log"></main>
      <footer>
        <input id="input" spellcheck="false" data-i18n-ph="chat.inputPh" disabled />
        <button id="send" class="send" disabled>↩</button>
      </footer>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
